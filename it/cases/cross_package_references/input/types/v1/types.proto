syntax = "proto3";

package types.v1;

import "cleanapi/cleanapi.proto";

option (cleanapi.file).package = "public_types.v1";

// User represents a user in the system.
message User {
  string id = 1;
  string name = 2;
  string email = 3;
  string internal_token = 4 [(cleanapi.field).private = true];
}

// Status represents the status of an operation.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_SUCCESS = 1;
  STATUS_FAILURE = 2;
  STATUS_INTERNAL_ERROR = 3 [(cleanapi.value).private = true];
}

