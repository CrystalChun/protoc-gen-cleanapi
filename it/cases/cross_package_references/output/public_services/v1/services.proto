syntax = "proto3";

package public_services.v1;

import "public_types/v1/types.proto";

// UserRequest is a request message that references a cross-package type.
message UserRequest {
  string user_id = 1;
  // This field uses a type from the types.v1 package.
  public_types.v1.Status expected_status = 2;
  // Test repeated field with cross-package type.
  repeated public_types.v1.Status allowed_statuses = 3;
  // Test optional field with cross-package type.
  optional public_types.v1.User requesting_user = 4;
}

// UserResponse is a response message that references a cross-package type.
message UserResponse {
  // This field uses a type from the types.v1 package.
  public_types.v1.User user = 1;
  public_types.v1.Status status = 2;
  // Test repeated field with cross-package type.
  repeated public_types.v1.User related_users = 3;
  // Test map field with cross-package type as value.
  map<string, public_types.v1.User> user_map = 4;
  // Test map field with cross-package type as key (enum).
  map<int32, public_types.v1.Status> status_map = 5;
}

// UserService provides operations on users using cross-package types.
service UserService {
  rpc GetUser(UserRequest) returns (UserResponse);
}
