syntax = "proto3";

package public.v1;

// Message with many fields, some private.
message HostDetails {
  string id = 1;
  string name = 2;
  string public_description = 6;
  string status = 9;
}

// Several consecutive private messages.
message PublicMessage1 {
  string value = 1;
}

message PublicMessage2 {
  string value = 1;
}

// Enum with multiple consecutive private values.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_INACTIVE = 5;
  STATUS_PENDING = 8;
}

// Multiple consecutive private enums.
enum PublicEnum1 {
  PUBLIC_ENUM1_UNSPECIFIED = 0;
  PUBLIC_ENUM1_VALUE = 1;
}

enum PublicEnum2 {
  PUBLIC_ENUM2_UNSPECIFIED = 0;
  PUBLIC_ENUM2_VALUE = 1;
}

// Service with multiple consecutive private methods.
service HostService {
  rpc GetHost(PublicMessage1) returns (PublicMessage1);
  rpc ListHosts(PublicMessage1) returns (PublicMessage2);
  rpc UpdateHost(PublicMessage2) returns (PublicMessage2);
}

// Multiple consecutive private services.
service PublicService1 {
  rpc DoSomething(PublicMessage1) returns (PublicMessage1);
}

service PublicService2 {
  rpc DoSomethingElse(PublicMessage2) returns (PublicMessage2);
}
