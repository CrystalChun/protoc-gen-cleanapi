syntax = "proto3";

package public.v1;

// PublicMessage is a public message that should be included in the public API.
message PublicMessage {
  // Public field that should be included.
  string id = 1;

  // Public field that should be included.
  string name = 2;

}

// AnotherPublicMessage is a public message.
message AnotherPublicMessage {
  string value = 1;
}

// PublicEnum is a public enum that should be included in the public API.
enum PublicEnum {
  // Default value.
  PUBLIC_ENUM_UNSPECIFIED = 0;

  // Public value that should be included.
  PUBLIC_ENUM_ACTIVE = 1;

  // Public value that should be included.
  PUBLIC_ENUM_INACTIVE = 2;

}

// AnotherPublicEnum is a public enum.
enum AnotherPublicEnum {
  ANOTHER_PUBLIC_ENUM_UNSPECIFIED = 0;
  ANOTHER_PUBLIC_ENUM_VALUE = 1;
}

// PublicService is a public service that should be included in the public API.
service PublicService {
  // Public method that should be included.
  rpc GetPublicMessage(PublicMessage) returns (PublicMessage);

  // Another public method that should be included.
  rpc ListPublicMessages(PublicMessage) returns (AnotherPublicMessage);

}

// AnotherPublicService is a public service.
service AnotherPublicService {
  rpc DoSomething(AnotherPublicMessage) returns (AnotherPublicMessage);
}
