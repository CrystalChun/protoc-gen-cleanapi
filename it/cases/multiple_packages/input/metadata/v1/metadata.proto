syntax = "proto3";

package metadata.v1;

import "cleanapi/cleanapi.proto";
import "shared/v1/common.proto";

option (cleanapi.file).package = "public_metadata.v1";

message MetadataInfo {
  string key = 1;
  string value = 2;
  shared.v1.Metadata common = 3;
  string secret = 4 [(cleanapi.field).private = true];
}

enum MetadataType {
  METADATA_TYPE_UNSPECIFIED = 0;
  METADATA_TYPE_USER = 1;
  METADATA_TYPE_INTERNAL = 2 [(cleanapi.value).private = true];
}

service MetadataService {
  rpc GetMetadata(MetadataInfo) returns (MetadataInfo);
}

