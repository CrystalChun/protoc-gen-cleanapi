syntax = "proto3";

package public_events.v1;

import "shared/v1/common.proto";

message Event {
  string id = 1;
  string type = 2;
  shared.v1.Metadata metadata = 3;
}

service EventService {
  rpc GetEvent(Event) returns (Event);
}
