// This is a file-level comment at the beginning of the file.
// It should be preserved because it's not attached to any element.

syntax = "proto3";

package public.v1;

/*
 * This is a standalone block comment between imports and messages.
 * It should be preserved.
 */

// Another standalone line comment.
// This one has multiple lines.
// All should be preserved.

// PublicMessage is a public message with various comment styles.
message PublicMessage {
  // This is a comment for a public field.
  string id = 1; // End of line comment for public field.
  
  /*
   * Block comment for another public field.
   */
  string name = 2;
  
  // Comment for another public field.
  string description = 4; // Another end of line comment.
}

// Standalone comment between messages.

// Standalone comment after private message.

// Comment for a public enum.
enum Status {
  // Comment for unspecified value.
  STATUS_UNSPECIFIED = 0; // End of line comment.
  
  // Comment for active status.
  STATUS_ACTIVE = 1;
  
  // Comment for inactive status.
  STATUS_INACTIVE = 3; // End of line comment for enum value.
}

/*
 * Standalone block comment between enum and service.
 * Multiple lines in this block.
 * All should be preserved.
 */

// Comment for public service.
service DataService {
  // Comment for public method.
  rpc GetData(PublicMessage) returns (PublicMessage); // End of line comment for method.
  
  // Comment for another public method.
  rpc ListData(PublicMessage) returns (PublicMessage);
}

// Standalone comment at the end of the file.

/*
 * Another standalone block comment at the end.
 */

// Final line comment at the very end.
