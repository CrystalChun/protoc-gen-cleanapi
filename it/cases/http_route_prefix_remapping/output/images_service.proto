syntax = "proto3";

package osac.public.v1;

import "google/api/annotations.proto";

message Image {
  string id = 1;
  string name = 2;
}

message ImagesGetRequest {
  string id = 1;
}

message ImagesGetResponse {
  Image object = 1;
}

message ImagesCreateRequest {
  Image object = 1;
}

message ImagesCreateResponse {
  Image object = 1;
}

service Images {
  rpc Get(ImagesGetRequest) returns (ImagesGetResponse) {
    option (google.api.http) = {
      get: "/api/new/v1/images/{id}"
      response_body: "object"
    };
  }
  rpc Create(ImagesCreateRequest) returns (ImagesCreateResponse) {
    option (google.api.http) = {
      post: "/api/new/v1/images"
      body: "object"
      response_body: "object"
    };
  }
}
