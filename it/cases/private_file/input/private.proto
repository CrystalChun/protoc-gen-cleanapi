syntax = "proto3";

package fulfillment.v1;

import "cleanapi/cleanapi.proto";

// This entire file should be excluded from the public API.
option (cleanapi.file).private = true;

// This message should not appear in the public API because the file is private.
message InternalData {
  string secret = 1;
  int32 debug_value = 2;
}

// This enum should not appear in the public API because the file is private.
enum InternalStatus {
  INTERNAL_STATUS_UNSPECIFIED = 0;
  INTERNAL_STATUS_ACTIVE = 1;
  INTERNAL_STATUS_INACTIVE = 2;
}

// This service should not appear in the public API because the file is private.
service InternalService {
  rpc GetInternalData(InternalData) returns (InternalData);
}

